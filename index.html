<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Finance Teaching Apps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #eef1f1; --fg: #1a2328; --muted: #5b6a70; --panel: #ffffff; --line: #d5dcde; --accent: #0f7c71; --cap: #f3f6f6;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #11171a; --fg: #e2e8ea; --muted: #9aaab0; --panel: #182024; --line: #29343a; --accent: #5cc9bb; --cap: #1f292e; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg: #11171a; --fg: #e2e8ea; --muted: #9aaab0; --panel: #182024; --line: #29343a; --accent: #5cc9bb; --cap: #1f292e; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
[hidden] { display: none !important; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { margin: 0 0 4px; font-size: 26px; font-weight: 600; }
.sub { margin: 0 0 24px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.mod { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card h2 { margin: 0; font-size: 17px; font-weight: 600; }
.card h2 a { color: var(--fg); text-decoration: none; }
.card h2 a:hover { color: var(--accent); }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.btn { font: 600 13px var(--font-body); color: var(--accent); background: transparent; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 999px; padding: 4px 12px; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.url { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.done { font-size: 12.5px; color: var(--accent); min-height: 1em; }
footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
</style>
</head><body>
<div class="wrap">
  <h1>Finance Teaching Apps</h1>
  <p class="sub">Interactive tools for FIN201 and MBA524. Open an app, or copy its embed code to paste into a Canvas page (HTML editor, the &lt;/&gt; button).</p>
  <div class="grid" id="grid"></div>
  <footer>Pages here are not listed by search engines. New apps are added to this list as they are published.</footer>
</div>
<script>
(function () {
  // One entry per app folder. Height = recommended iframe height in Canvas.
  const APPS = [
    { dir: 'who-gets-paid', title: 'Who Gets Paid?', mod: 'Module 1 · The corporation', h: 4900,
      d: 'An hourglass that pours firm value through secured debt, bonds, preferred and common stock, plus payoff diagrams and the risky-project conflict.' },
    { dir: 'tvm-stories', title: 'TVM Stories', mod: 'Module 3 · Time value of money', h: 9900,
      d: 'Start early vs. start late, what $1 became since 1928, the cash-flow timeline, the Powerball jackpot, the minimum-payment trap, the true cost of "easy" money, and the Rule of 72.' },
    { dir: 'financial-calculator', title: 'Financial Calculator', mod: 'Module 3 · Time value of money', h: 1500,
      d: 'BA II Plus-style keystrokes: TVM, CF/NPV/IRR, AMORT and ICONV, with step-by-step worked examples.' },
    { dir: 'yield-curve', title: 'Yield Curve Time Machine', mod: 'Module 4 · Interest rates', h: 2450,
      d: 'Monthly U.S. Treasury yield curves since 1990 from FRED, with inversions, the Fed funds rate and the 10y−2y spread.' },
    { dir: 'beta-capm', title: 'Beta and the SML', mod: 'Module 5 · Risk and return', h: 4650,
      d: 'Beta from real monthly returns of ten well-known stocks, the Security Market Line with CAPM required returns, and portfolio beta.' },
    { dir: 'bond-price-yield', title: 'Bond Price and Yield', mod: 'Module 6 · Valuing bonds', h: 4000,
      d: 'A seesaw for price and yield, the N/I/YR/PMT/FV calculation, 1-year vs 10-year price risk, and the pull to par.' },
    { dir: 'triangular-arbitrage', title: 'Triangular Arbitrage Game', mod: 'FIN368 · Exchange rates (also FIN201 Module 4)', h: 4400,
      d: 'Spot the mispriced cross rate and trade $1,000,000 around the triangle. Timed rounds with class codes, bid–ask spreads, and why the gap disappears.' },
    { dir: 'fx-hedging', title: 'Hedge or Gamble?', mod: 'FIN368 · Transaction exposure', h: 6200,
      d: 'Forward, money market and option hedges against remaining unhedged: payoff chart with break-evens, then replay real 90-day windows since 1999 (Lehman, Brexit, COVID).' },
    { dir: 'ppp-decades', title: 'PPP Over the Decades', mod: 'FIN368 · Parity conditions (also FIN201 Module 4)', h: 4750,
      d: 'Relative PPP tested on 50+ years of real exchange-rate and inflation data for 14 currencies: the PPP path, the real exchange rate, and inflation vs. depreciation.' },
    { dir: 'country-risk', title: 'Country Risk Premiums', mod: 'FIN368 · Country risk and cost of capital', h: 4700,
      d: "A world map of Damodaran's country risk premiums, the cost of equity for a project abroad, and rankings for 178 countries." },
  ];
  const base = location.href.replace(/[#?].*$/, '').replace(/index\.html$/, '');
  const grid = document.getElementById('grid');
  APPS.forEach(a => {
    const url = base + a.dir + '/';
    const embed = `<iframe src="${url}" title="${a.title}" width="100%" height="${a.h}" style="border:0;" loading="lazy"></iframe>`;
    const c = document.createElement('article'); c.className = 'card';
    c.innerHTML = `<span class="mod"></span><h2><a target="_blank" rel="noopener"></a></h2><p></p><span class="url"></span>
      <div class="row"><a class="btn primary" target="_blank" rel="noopener">Open</a><button class="btn" type="button">Copy Canvas embed code</button></div><span class="done" aria-live="polite"></span>`;
    c.querySelector('.mod').textContent = a.mod;
    const h = c.querySelector('h2 a'); h.textContent = a.title; h.href = url;
    c.querySelector('p').textContent = a.d;
    c.querySelector('.url').textContent = url;
    c.querySelector('a.btn').href = url;
    const done = c.querySelector('.done');
    c.querySelector('button').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(embed); done.textContent = 'Copied. Paste it in the Canvas HTML editor.'; }
      catch (e) { window.prompt('Copy this embed code:', embed); }
    });
    grid.appendChild(c);
  });
})();
</script>
</body></html>
